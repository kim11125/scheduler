spring:
  datasource:
    url: jdbc:h2:mem:scheduler;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true

jwt:
  secret: thisIsAVeryLongSecretKeyForSchedulerAppPleaseChangeInProduction123!
  expiration: 86400000
