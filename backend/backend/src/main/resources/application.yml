spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  secret: ${JWT_SECRET:thisIsAVeryLongSecretKeyForSchedulerAppPleaseChangeInProduction123!}
  expiration: 86400000  # 24시간 (ms)

app:
  upload:
    profile-image-dir: ./uploads/profile-images
    base-url: /uploads

logging:
  level:
    com.scheduler: DEBUG
