services:
  postgres:
    image: postgres:15-alpine
    container_name: scheduler-db
    restart: always
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler1234
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    container_name: scheduler-backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_NAME: scheduler
      DB_USER: scheduler
      DB_PASSWORD: scheduler1234
      JWT_SECRET: thisIsAVeryLongSecretKeyForSchedulerAppPleaseChangeInProduction123!
      TZ: Asia/Seoul
    ports:
      - "9090:8080"
    volumes:
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: scheduler-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/uploads
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
